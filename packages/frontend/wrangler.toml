# Frontend (SvelteKit) — Cloudflare Pages
# 部署：wrangler pages deploy .svelte-kit/cloudflare --project-name sol-dca-dashboard
#
# Bindings:
#   SOL_DCA_WORKER  — Service binding → sol-dca-do-worker (DO 状态机 + WS 路由)
#
# Vars:
#   PUBLIC_WS_URL   — Browser 端 WebSocket 连接 URL
#                     dev:  ws://localhost:8787/ws
#                     prod: wss://sol-dca-do-worker.<sub>.workers.dev/ws
#                     (Pages dashboard 设 env var, 这里只声明 shape)

name = "sol-dca-dashboard"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_als"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# === Service binding → DO Worker ===
# Pages Function 里: await env.SOL_DCA_WORKER.fetch('https://do/state', { method: 'GET' })
# Worker 内部路由: /state /control /ws /health
[[services]]
binding = "SOL_DCA_WORKER"
service = "sol-dca-do-worker"



# === Observability ===
[observability]
enabled = true
